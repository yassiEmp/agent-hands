# Publish agent-hands to npm on a GitHub release, using Trusted Publishing.
#
# No npm token is stored anywhere. GitHub mints a short-lived OIDC identity for this specific
# workflow, and npm accepts it because the package is registered with this repo + workflow as a
# trusted publisher (npmjs.com -> package settings -> Trusted Publisher). That is why
# `id-token: write` below is mandatory: without it there is no identity to present.
#
# Mirrors the agent-win -> PyPI workflow (same repo owner, same pattern).
#
# Requires npm CLI >= 11.5.1 for trusted publishing. Node 24 bundles that by default — Node 22
# bundles npm 10, which silently falls back to an anonymous request and fails with a misleading
# E404 rather than a clear auth error. A manual `npm install -g npm@latest` on top of Node 22 was
# tried first and still 404'd (the self-upgraded CLI did not take effect for the publish step), so
# this follows npm's own documented example and just runs on Node 24 instead. See
# https://docs.npmjs.com/trusted-publishers/ and https://github.com/npm/cli/issues/9088.

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:        # lets you publish by hand from the Actions tab

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm          # must match the environment named on npmjs.com, if you set one
    permissions:
      id-token: write          # required: this is what mints the OIDC token
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Verify package version matches the release tag
        if: github.event_name == 'release'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version ($PKG_VERSION) does not match release tag ($GITHUB_REF_NAME)"
            exit 1
          fi
      - name: Debug — npm/node versions and OIDC-relevant env
        run: |
          node --version
          npm --version
          echo "ACTIONS_ID_TOKEN_REQUEST_URL is set: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo yes || echo no)"
          npm config get registry
          cat "$NPM_CONFIG_USERCONFIG" 2>/dev/null | sed 's/_authToken=.*/_authToken=<redacted>/'
      - run: npm publish
